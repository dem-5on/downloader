<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  :root { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 1rem; }
  .row { display: flex; gap: .5rem; margin: .75rem 0; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 240px; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  fieldset { border: 1px solid #ccc; padding: .75rem; }
  #status { min-height: 1.5em; margin: .5rem 0; }
  #status.error { color: #b00020; }
  .card { display: flex; gap: .75rem; border: 1px solid #ddd; border-radius: 8px;
          padding: .75rem; margin: .5rem 0; align-items: center; }
  .card img { width: 160px; height: 90px; object-fit: cover; border-radius: 4px; background: #eee; }
  .card .meta { flex: 1; min-width: 0; }
  .card .meta b { display: block; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: #666; font-size: .9rem; }
  .prog { display: flex; gap: .5rem; align-items: center; margin-top: .4rem; }
  .prog progress { flex: 1; height: 1.1rem; }
  .prog .plabel { font-size: .8rem; color: #444; white-space: nowrap; }
  #zipbar { margin: .5rem 0; }
</style>
</head>
<body>
<h1>Video Downloader</h1>

<div class="row">
  <input id="url" type="text" placeholder="Paste a YouTube link…" autocomplete="off" spellcheck="false">
  <button id="fetch">Fetch</button>
</div>

<fieldset>
  <legend>Download options</legend>
  <div class="row">
    <label>Quality:
      <select id="quality">
        <option value="best">Best</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
        <option value="360p">360p</option>
      </select>
    </label>
    <label><input id="subs" type="checkbox" checked> Subtitles</label>
    <label><input id="audio" type="checkbox"> Audio only (mp3)</label>
  </div>
</fieldset>

<div id="status" class="muted"></div>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), resultsEl = $('results');

function setStatus(msg, isError) {
  statusEl.textContent = msg || '';
  statusEl.className = isError ? 'error' : 'muted';
}

function fmtDuration(sec) {
  if (sec == null) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
           : `${m}:${String(s).padStart(2, '0')}`;
}

function opts() {
  return {
    quality: $('audio').checked ? 'best' : $('quality').value,
    audio_only: $('audio').checked,
    subtitles: $('subs').checked,
  };
}

$('audio').addEventListener('change', e => { $('quality').disabled = e.target.checked; });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') fetchInfo(); });
$('fetch').addEventListener('click', fetchInfo);

// ---- job helpers: start -> poll progress -> save file ----

async function startJob(payload) {
  const r = await fetch('/api/jobs', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Could not start download.');
  return data.job_id;
}

function pollJob(jobId, onTick) {
  return new Promise((resolve, reject) => {
    const timer = setInterval(async () => {
      try {
        const r = await fetch('/api/jobs/' + jobId);
        const s = await r.json();
        if (!r.ok) { clearInterval(timer); reject(new Error(s.error || 'Job lost.')); return; }
        onTick(s);
        if (s.status === 'done') { clearInterval(timer); resolve(s); }
        else if (s.status === 'error') { clearInterval(timer); reject(new Error(s.error || 'Download failed.')); }
      } catch (e) {
        clearInterval(timer);
        reject(e);
      }
    }, 500);
  });
}

function saveJobFile(jobId, fallbackName) {
  const a = document.createElement('a');
  a.href = '/api/jobs/' + jobId + '/file';
  a.download = fallbackName || 'download';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function tickBar(bar, label, s) {
  if (s.kind === 'zip') {
    const base = (s.current / Math.max(s.total, 1)) * 100;
    const val = s.status === 'zipping' ? 100 : base + (s.percent || 0) / Math.max(s.total, 1);
    bar.value = Math.min(val, 100);
    label.textContent = s.status === 'zipping' ? 'Packing ZIP…'
      : `${s.current}/${s.total} · ${Math.round(s.percent || 0)}%` +
        (s.speed ? ` · ${s.speed}` : '');
  } else {
    bar.value = s.percent || 0;
    label.textContent = `${Math.round(s.percent || 0)}%` +
      (s.speed ? ` · ${s.speed}` : '') + (s.eta ? ` · ETA ${s.eta}` : '');
  }
}

// ---- rendering ----

async function fetchInfo() {
  const url = $('url').value.trim();
  if (!url) return setStatus('Paste a YouTube URL first.', true);
  setStatus('Fetching…');
  resultsEl.innerHTML = '';
  $('fetch').disabled = true;
  try {
    const r = await fetch('/api/info', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url}),
    });
    const data = await r.json();
    if (!r.ok) return setStatus(data.error || 'Fetch failed.', true);
    setStatus('');
    if (data.type === 'playlist') renderPlaylist(data);
    else resultsEl.appendChild(card(data, data.uploader || 'Video'));
  } catch (e) {
    setStatus('Network error: ' + e.message, true);
  } finally {
    $('fetch').disabled = false;
  }
}

function progressEls() {
  const wrap = document.createElement('div');
  wrap.className = 'prog';
  wrap.hidden = true;
  wrap.innerHTML = '<progress max="100" value="0"></progress><span class="plabel muted"></span>';
  return [wrap, wrap.querySelector('progress'), wrap.querySelector('.plabel')];
}

function card(item, tag) {
  const div = document.createElement('div');
  div.className = 'card';
  const dur = fmtDuration(item.duration);
  div.innerHTML =
    (item.thumbnail ? `<img src="${item.thumbnail}" alt="" loading="lazy">` : '') +
    `<div class="meta"><b></b>
     <span class="muted">${tag || ''}${dur ? ' · ' + dur : ''}</span></div>`;
  div.querySelector('b').textContent = item.title || 'Untitled';
  const [wrap, bar, label] = progressEls();
  div.querySelector('.meta').appendChild(wrap);
  const btn = document.createElement('button');
  btn.textContent = 'Download';
  btn.addEventListener('click', () => downloadVideo(item.url || $('url').value.trim(), btn, bar, label, wrap));
  div.appendChild(btn);
  return div;
}

function renderPlaylist(pl) {
  const h = document.createElement('div');
  h.innerHTML = '<p><b></b> <span class="muted"></span></p>';
  h.querySelector('b').textContent = pl.title;
  h.querySelector('span').textContent = `· ${pl.count} videos — set options above, then download one video or grab all as a ZIP.`;
  const zipBtn = document.createElement('button');
  zipBtn.textContent = 'Download all as ZIP';
  const [wrap, bar, label] = progressEls();
  wrap.id = 'zipbar';
  h.appendChild(zipBtn);
  h.appendChild(wrap);
  resultsEl.appendChild(h);
  zipBtn.addEventListener('click', () => downloadZip(pl, zipBtn, bar, label, wrap));
  pl.entries.forEach(e => resultsEl.appendChild(card(e, null)));
}

async function downloadVideo(url, btn, bar, label, wrap) {
  const orig = btn.textContent;
  btn.disabled = true;
  wrap.hidden = false;
  bar.value = 0;
  label.textContent = 'Starting…';
  try {
    const jobId = await startJob({type: 'video', url, ...opts()});
    const done = await pollJob(jobId, s => tickBar(bar, label, s));
    saveJobFile(jobId, done.filename);
    setStatus('Saved: ' + (done.filename || 'video'));
    wrap.hidden = true;
  } catch (e) {
    setStatus(e.message, true);
    label.textContent = 'Failed';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function downloadZip(pl, btn, bar, label, wrap) {
  const orig = btn.textContent;
  const urls = pl.entries.filter(e => e.url).map(e => ({url: e.url, title: e.title}));
  if (!urls.length) return setStatus('No downloadable entries in this playlist.', true);
  btn.disabled = true;
  wrap.hidden = false;
  bar.value = 0;
  label.textContent = 'Starting…';
  try {
    const jobId = await startJob({type: 'zip', urls, playlist_title: pl.title, ...opts()});
    const done = await pollJob(jobId, s => tickBar(bar, label, s));
    saveJobFile(jobId, done.filename);
    const fails = done.failed || [];
    setStatus('Saved: ' + (done.filename || 'playlist.zip') +
      (fails.length ? ` (${fails.length} failed: ${fails.slice(0, 3).join('; ')})` : ''));
    if (!fails.length) wrap.hidden = true;
  } catch (e) {
    setStatus(e.message, true);
    label.textContent = 'Failed';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}
</script>
</body>
</html>
