<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8eaf0;
    background:
      radial-gradient(900px 400px at 15% -5%, rgba(255, 60, 60, .14), transparent 60%),
      radial-gradient(800px 400px at 90% 0%, rgba(90, 100, 255, .16), transparent 60%),
      #0e1117;
  }
  /* Centered hero: header + input + options sit in the middle of the page.
     Once results arrive, body.has-results pins everything to the top and
     the preview renders underneath. */
  .wrap {
    width: 100%; max-width: 900px; margin: 0 auto;
    padding: 1.5rem 1.25rem 5rem;
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }
  body.has-results .wrap { justify-content: flex-start; padding-top: 2.5rem; }

  header.hero { display: flex; gap: 1rem; align-items: center; justify-content: center; text-align: left; margin-bottom: 1.5rem; }
  .logo {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, #ff3b3b, #b3122e);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(255, 45, 60, .35);
  }
  header.hero h1 { margin: 0; font-size: 1.9rem; letter-spacing: -.02em; }
  header.hero p { margin: .2rem 0 0; color: #9aa3b2; font-size: .95rem; }

  .panel {
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 16px;
    padding: 1.1rem 1.2rem;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    backdrop-filter: blur(6px);
  }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .search { margin-bottom: 1rem; }
  fieldset .row { justify-content: center; }
  input[type=text] {
    flex: 1; min-width: 240px;
    padding: .8rem 1rem; font-size: 1rem; color: #e8eaf0;
    background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: #ff4d5e; box-shadow: 0 0 0 3px rgba(255, 60, 80, .2); }
  input[type=text]::placeholder { color: #6b7484; }

  button {
    padding: .8rem 1.4rem; font-size: 1rem; font-weight: 600;
    color: #fff; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #ff4d5e, #c11130);
    box-shadow: 0 6px 18px rgba(255, 45, 70, .35);
    transition: transform .08s, box-shadow .15s, filter .15s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 8px 22px rgba(255, 45, 70, .45); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: wait; }

  fieldset { border: none; margin: 0 0 1rem; padding: 0; }
  fieldset legend { display: none; }
  .opts-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: #9aa3b2; margin: 0 0 .6rem; }
  .pill {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .5rem .8rem; border-radius: 999px; font-size: .92rem;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .1);
    cursor: pointer; user-select: none;
  }
  .pill input { accent-color: #ff4d5e; width: 1rem; height: 1rem; cursor: pointer; }
  select {
    padding: .5rem .6rem; font-size: .92rem; color: #e8eaf0;
    background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; outline: none; cursor: pointer;
  }
  select:disabled { opacity: .45; cursor: not-allowed; }
  select option { color: #111; }

  #status { min-height: 1.5em; margin: .4rem 0 .8rem; font-size: .95rem; text-align: center; }
  #status:empty { display: none; }
  #status.muted { color: #9fe6a0; }

  /* Error popups: fixed overlay, never shift the page layout. */
  #toasts {
    position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
    z-index: 50; display: flex; flex-direction: column; gap: .5rem; align-items: center;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex; gap: .8rem; align-items: center;
    max-width: min(90vw, 560px);
    background: #2a1216; color: #ffd9dc;
    border: 1px solid rgba(255, 90, 100, .5); border-radius: 12px;
    padding: .7rem 1rem; font-size: .92rem;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    animation: rise .25s ease;
  }
  .toast button {
    background: none; border: none; box-shadow: none;
    color: inherit; padding: .1rem .35rem; font-size: 1rem; line-height: 1;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .pl-head { margin: 1.2rem 0 .4rem; }
  .pl-head p { margin: 0 0 .7rem; font-size: 1.05rem; }
  .pl-head .muted { font-size: .88rem; }

  .card {
    display: flex; gap: 1rem; align-items: center;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 14px; padding: .9rem; margin: .6rem 0;
    transition: transform .12s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-1px); border-color: rgba(255, 90, 110, .4); box-shadow: 0 10px 28px rgba(0, 0, 0, .4); }
  .card img {
    width: 168px; height: 94px; object-fit: cover; border-radius: 10px;
    background: #222; flex: none;
  }
  .card .meta { flex: 1; min-width: 0; }
  .card .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1rem; }
  .muted { color: #9aa3b2; font-size: .88rem; }
  .card button { padding: .6rem 1rem; font-size: .92rem; flex: none; }

  .prog { display: flex; gap: .6rem; align-items: center; margin-top: .55rem; }
  .prog progress { flex: 1; height: .7rem; appearance: none; -webkit-appearance: none; }
  .prog progress::-webkit-progress-bar { background: rgba(255, 255, 255, .1); border-radius: 999px; }
  .prog progress::-webkit-progress-value { background: linear-gradient(90deg, #ff4d5e, #ff8a5c); border-radius: 999px; transition: width .2s; }
  .prog progress::-moz-progress-bar { background: linear-gradient(90deg, #ff4d5e, #ff8a5c); border-radius: 999px; }
  .prog .plabel { font-size: .78rem; color: #c7cdd8; white-space: nowrap; min-width: 120px; }
  #zipbar { margin: .7rem 0; max-width: 520px; }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: .8rem; text-align: center;
    color: #5d6675; font-size: .8rem;
    background: linear-gradient(transparent, rgba(14, 17, 23, .9));
    pointer-events: none;
  }

  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } }
  #results .card, #results .pl-head { animation: fadeSlide .3s ease; }

  @media (max-width: 600px) {
    .card { flex-wrap: wrap; }
    .card img { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .card button { width: 100%; }
    header.hero h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg>
    </div>
    <div>
      <h1>Video Downloader</h1>
      <p>Paste a YouTube link, preview it, pick your options, download.</p>
    </div>
  </header>

  <div class="panel search row">
    <input id="url" type="text" placeholder="Paste a YouTube link…" autocomplete="off" spellcheck="false">
    <button id="fetch">Fetch</button>
  </div>

  <fieldset>
    <div class="panel">
      <p class="opts-title">Download options</p>
      <div class="row">
        <label class="pill">Quality:
          <select id="quality">
            <option value="best">Best</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </label>
        <label class="pill"><input id="subs" type="checkbox" checked> Subtitles</label>
        <label class="pill"><input id="audio" type="checkbox"> Audio only (mp3)</label>
      </div>
    </div>
  </fieldset>

  <div id="status" class="muted"></div>

  <div id="results"></div>

  <div id="toasts" aria-live="polite"></div>

  <footer>Runs locally · files download straight to your device</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), resultsEl = $('results'), toastsEl = $('toasts');

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.textContent = msg || 'Something went wrong. Please try again.';
  const x = document.createElement('button');
  x.textContent = '✕';
  x.setAttribute('aria-label', 'Dismiss');
  x.addEventListener('click', () => el.remove());
  el.appendChild(span);
  el.appendChild(x);
  toastsEl.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function setStatus(msg, isError) {
  // Errors never touch the page flow: popup only, hero stays centered.
  if (isError) { toast(msg); return; }
  statusEl.textContent = msg || '';
  statusEl.className = 'muted';
}

function fmtDuration(sec) {
  if (sec == null) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
           : `${m}:${String(s).padStart(2, '0')}`;
}

function opts() {
  return {
    quality: $('audio').checked ? 'best' : $('quality').value,
    audio_only: $('audio').checked,
    subtitles: $('subs').checked,
  };
}

$('audio').addEventListener('change', e => { $('quality').disabled = e.target.checked; });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') fetchInfo(); });
$('fetch').addEventListener('click', fetchInfo);

// ---- job helpers: start -> poll progress -> save file ----

async function startJob(payload) {
  const r = await fetch('/api/jobs', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Could not start download.');
  return data.job_id;
}

function pollJob(jobId, onTick) {
  return new Promise((resolve, reject) => {
    const timer = setInterval(async () => {
      try {
        const r = await fetch('/api/jobs/' + jobId);
        const s = await r.json();
        if (!r.ok) { clearInterval(timer); reject(new Error(s.error || 'Job lost.')); return; }
        onTick(s);
        if (s.status === 'done') { clearInterval(timer); resolve(s); }
        else if (s.status === 'error') { clearInterval(timer); reject(new Error(s.error || 'Download failed.')); }
      } catch (e) {
        clearInterval(timer);
        reject(e);
      }
    }, 500);
  });
}

function saveJobFile(jobId, fallbackName) {
  const a = document.createElement('a');
  a.href = '/api/jobs/' + jobId + '/file';
  a.download = fallbackName || 'download';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function tickBar(bar, label, s) {
  if (s.kind === 'zip') {
    const base = (s.current / Math.max(s.total, 1)) * 100;
    const val = s.status === 'zipping' ? 100 : base + (s.percent || 0) / Math.max(s.total, 1);
    bar.value = Math.min(val, 100);
    label.textContent = s.status === 'zipping' ? 'Packing ZIP…'
      : `${s.current}/${s.total} · ${Math.round(s.percent || 0)}%` +
        (s.speed ? ` · ${s.speed}` : '');
  } else {
    bar.value = s.percent || 0;
    label.textContent = `${Math.round(s.percent || 0)}%` +
      (s.speed ? ` · ${s.speed}` : '') + (s.eta ? ` · ETA ${s.eta}` : '');
  }
}

// ---- rendering ----

async function fetchInfo() {
  const url = $('url').value.trim();
  if (!url) return setStatus('Paste a YouTube URL first.', true);
  setStatus('Fetching…');
  resultsEl.innerHTML = '';
  document.body.classList.remove('has-results');
  $('fetch').disabled = true;
  try {
    const r = await fetch('/api/info', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url}),
    });
    const data = await r.json();
    if (!r.ok) return setStatus(data.error || 'Fetch failed.', true);
    if (data.type === 'playlist' && !data.count) {
      return setStatus('No videos found in that playlist.', true);
    }
    setStatus('');
    // Preview goes underneath: pin the hero to the top.
    document.body.classList.add('has-results');
    if (data.type === 'playlist') renderPlaylist(data);
    else resultsEl.appendChild(card(data, data.uploader || 'Video'));
  } catch (e) {
    setStatus('Network error: ' + e.message, true);
  } finally {
    $('fetch').disabled = false;
  }
}

function progressEls() {
  const wrap = document.createElement('div');
  wrap.className = 'prog';
  wrap.hidden = true;
  wrap.innerHTML = '<progress max="100" value="0"></progress><span class="plabel muted"></span>';
  return [wrap, wrap.querySelector('progress'), wrap.querySelector('.plabel')];
}

function card(item, tag) {
  const div = document.createElement('div');
  div.className = 'card';
  const dur = fmtDuration(item.duration);
  div.innerHTML =
    (item.thumbnail ? `<img src="${item.thumbnail}" alt="" loading="lazy">` : '') +
    `<div class="meta"><b></b>
     <span class="muted">${tag || ''}${dur ? ' · ' + dur : ''}</span></div>`;
  div.querySelector('b').textContent = item.title || 'Untitled';
  const [wrap, bar, label] = progressEls();
  div.querySelector('.meta').appendChild(wrap);
  const btn = document.createElement('button');
  btn.textContent = 'Download';
  btn.addEventListener('click', () => downloadVideo(item.url || $('url').value.trim(), btn, bar, label, wrap));
  div.appendChild(btn);
  return div;
}

function renderPlaylist(pl) {
  const h = document.createElement('div');
  h.className = 'pl-head';
  h.innerHTML = '<p><b></b> <span class="muted"></span></p>';
  h.querySelector('b').textContent = pl.title;
  h.querySelector('span').textContent = `· ${pl.count} videos — set options above, then download one video or grab all as a ZIP.`;
  const zipBtn = document.createElement('button');
  zipBtn.textContent = 'Download all as ZIP';
  const [wrap, bar, label] = progressEls();
  wrap.id = 'zipbar';
  h.appendChild(zipBtn);
  h.appendChild(wrap);
  resultsEl.appendChild(h);
  zipBtn.addEventListener('click', () => downloadZip(pl, zipBtn, bar, label, wrap));
  pl.entries.forEach(e => resultsEl.appendChild(card(e, null)));
}

async function downloadVideo(url, btn, bar, label, wrap) {
  const orig = btn.textContent;
  btn.disabled = true;
  wrap.hidden = false;
  bar.value = 0;
  label.textContent = 'Starting…';
  try {
    const jobId = await startJob({type: 'video', url, ...opts()});
    const done = await pollJob(jobId, s => tickBar(bar, label, s));
    saveJobFile(jobId, done.filename);
    setStatus('Saved: ' + (done.filename || 'video'));
    wrap.hidden = true;
  } catch (e) {
    setStatus(e.message, true);
    label.textContent = 'Failed';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function downloadZip(pl, btn, bar, label, wrap) {
  const orig = btn.textContent;
  const urls = pl.entries.filter(e => e.url).map(e => ({url: e.url, title: e.title}));
  if (!urls.length) return setStatus('No downloadable entries in this playlist.', true);
  btn.disabled = true;
  wrap.hidden = false;
  bar.value = 0;
  label.textContent = 'Starting…';
  try {
    const jobId = await startJob({type: 'zip', urls, playlist_title: pl.title, ...opts()});
    const done = await pollJob(jobId, s => tickBar(bar, label, s));
    saveJobFile(jobId, done.filename);
    const fails = done.failed || [];
    setStatus('Saved: ' + (done.filename || 'playlist.zip') +
      (fails.length ? ` (${fails.length} failed: ${fails.slice(0, 3).join('; ')})` : ''));
    if (!fails.length) wrap.hidden = true;
  } catch (e) {
    setStatus(e.message, true);
    label.textContent = 'Failed';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}
</script>
</body>
</html>
